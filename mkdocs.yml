site_name: Background NPCs
repo_url: https://github.com/Shark-vil/background-citizens
site_author: Shark_vil
site_description: Setup, practical examples and Lua API for Background NPCs
site_url: https://shark-vil.github.io/background-citizens
theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    # Full page navigation keeps the i18n language switcher on the current page.
    - navigation.expand
    - navigation.tracking
    - navigation.sections
    - toc.integrate
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.footer
    - search.highlight
    - content.code.copy
use_directory_urls: false
plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: ru
          name: Русский
          build: true
          nav_translations:
            Architecture: Архитектура
            Version history: История версий
            AI documentation rules: Правила документации для ИИ
            Server API: Серверный API
            Client API: Клиентский API
            Shared API: Общий API
            Vehicles: Транспорт
            Wanted: Розыск
            Gangs: Банды
            Medics and bodies: Медики и тела
            Home: Главная
            Guide: Руководство
            Quick start: Быстрый старт
            Examples: Примеры
            Troubleshooting: Решение проблем
            Custom actors: Свои акторы
            Edit actors: Изменение акторов
            Actor settings: Параметры акторов
            Maps: Карты
            Systems: Системы
            Navigation: Навигация
            Brains: Поведение
            Settings menu: Меню настроек
            Ghost crowd: Фоновая толпа
            Testing mode: Режим тестирования
            Conversations: Разговоры
            Arrest: Арест
            Voices: Голоса
            Scenic scenes: Сценические сцены
            Reference: Справочник
            Actor API: API актора
            Building the docs: Сборка документации
nav:
  - Home: index.md
  - Guide:
      - Quick start: getting-started.md
      - Examples: examples.md
      - Troubleshooting: troubleshooting.md
      - Custom actors: tutorials/Creating-Custom-NPCs.md
      - Edit actors: tutorials/Modification-of-Existing-NPCs.md
      - Actor settings: tutorials/Actor-Config-Settings.md
      - Maps: information/More maps.md
  - Systems:
      - Navigation: systems/navigation.md
      - Brains: systems/brains.md
      - Settings menu: systems/menu.md
      - Ghost crowd: systems/ghost-crowd.md
      - Testing mode: systems/testing.md
      - Conversations: systems/conversations.md
      - Arrest: systems/arrest.md
      - Vehicles: systems/vehicles.md
      - Wanted: systems/wanted.md
      - Gangs: systems/gangs.md
      - Medics and bodies: systems/medics.md
      - Voices: systems/voices.md
      - Scenic scenes: systems/scenic.md
  - Reference:
      - Architecture: architecture.md
      - Version history: history.md
      - Actor API: classes/actor/index.md
      - Server API: reference/server.md
      - Client API: reference/client.md
      - Shared API: reference/shared.md
      - AI documentation rules: ai.md
      - Building the docs: contributing.md
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - meta
  - pymdownx.highlight
  - pymdownx.superfences
extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Shark-vil/
    - icon: fontawesome/brands/discord
      link: https://discord.gg/wZwtQTU
    - icon: fontawesome/brands/steam
      link: https://steamcommunity.com/id/shark_vil/
    - icon: fontawesome/brands/youtube
      link: https://www.youtube.com/channel/UCceZ68lbnrBGBPXgMPBOfoA
copyright: Copyright &copy; 2020 - 2021 Shark_vil
