bgn.settings.arrest=Режим ареста

bgn.settings.arrest.arrest_mode=Включить арест
bgn.settings.arrest.arrest_mode.help=Полиция сначала пытается арестовать. Работает в DarkRP.

bgn.settings.arrest.arrest_time_limit=Время на сдачу
bgn.settings.arrest.arrest_time_limit.help=Сколько секунд полиция ждёт, пока вы сдадитесь. Потом стреляет.

bgn.settings.arrest.arrest_time=Время ареста
bgn.settings.arrest.arrest_time.help=Сколько секунд длится задержание.

bgn.settings.arrest.surrender_delay=Второй шанс сдаться
bgn.settings.arrest.surrender_delay.help=Сколько секунд без урона и без оружия (или только с безопасным, например физганом или кулаками), после чего полиция снова предлагает сдаться, даже после перестрелки. 0 — выключено.
bgn.settings.arrest.car_wait=Взлом машины: ожидание
bgn.settings.arrest.car_wait.help=Сколько секунд игрок может стоять на месте в машине, пока рядом полиция. Потом полиция начинает вскрывать машину. 0 — выключено.
bgn.settings.arrest.car_time=Взлом машины: длительность
bgn.settings.arrest.car_time.help=За сколько секунд полиция вскрывает машину. Если игрок не уехал, его арестовывают.
bgn.hud.car_breakin=Полиция вскрывает машину — уезжайте!
