bgn.settings.extension=Расширения

bgn.settings.extension.drop_money=Деньги с NPC
bgn.settings.extension.drop_money.help=После смерти с NPC выпадают деньги.

bgn.settings.extension.disable_dialogues=Без разговоров
bgn.settings.extension.disable_dialogues.help=NPC не разговаривают друг с другом.

bgn.settings.extension.shot_sound_mode=Реакция на звук выстрелов (ЭКСПЕРИМЕНТАЛЬНО)
bgn.settings.extension.shot_sound_mode.help=NPC пугаются любого выстрела рядом. Может работать плохо.

bgn.settings.extension.all_models_random=Случайные модели
bgn.settings.extension.all_models_random.help=NPC берут любые модели из игры.

bgn.settings.extension.replics_enable=Реплики над головой
bgn.settings.extension.replics_enable.help=Текст того, что говорят NPC.

bgn.settings.extension.custom_gestures=Расширенные анимации (ЭКСПЕРИМЕНТАЛЬНО)
bgn.settings.extension.custom_gestures.help=NPC танцуют и делают больше разных действий. Выключите, если что-то сломалось.

bgn.settings.extension.tactical_groups=Отряды
bgn.settings.extension.tactical_groups.help=Полиция, спецназ и банды действуют отрядами и держат строй.

bgn.settings.extension.react_to_lethal_weapon=Реакция на оружие в руках
bgn.settings.extension.react_to_lethal_weapon.help=Жители и полиция реагируют на известное летальное оружие в пределах 800 единиц, с проверкой видимости и FOV раз в секунду. По умолчанию выключено; обучение продолжается и при выключенной настройке.
