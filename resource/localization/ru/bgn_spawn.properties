bgn.settings.spawn=Спавнер

bgn.settings.spawn.spawn_radius=Радиус появления
bgn.settings.spawn.spawn_radius.help=Как далеко от игрока появляются NPC.

bgn.settings.spawn.spawn_radius_visibility=Запрет появления транспорта перед игроком
bgn.settings.spawn.spawn_radius_visibility.help=В этом радиусе в направлении взгляда любого игрока транспорт DV появляется, только если вся машина скрыта препятствием. На обычных NPC не влияет.

bgn.settings.spawn.actor_unseen_time=Время вне наблюдения
bgn.settings.spawn.actor_unseen_time.help=Через сколько секунд без наблюдения любым игроком NPC можно перенести или удалить. Проверяются направление взгляда и препятствия. Защищённые NPC и занятые сцены сохраняются. 0 — без задержки.

bgn.settings.spawn.spawn_block_radius=Не появляться ближе
bgn.settings.spawn.spawn_block_radius.help=NPC не появляются ближе этого расстояния к игроку. 0 — выключено.

bgn.settings.spawn.spawn_period=Задержка появления
bgn.settings.spawn.spawn_period.help=Пауза в секундах между проходами спавнера. За проход он пытается создать по одному NPC каждого подходящего типа. Изменение применяется сразу.

bgn.settings.spawn.actors_teleporter=Переносить вместо удаления
bgn.settings.spawn.actors_teleporter.help=NPC, которого никто не видит, переносится ближе к игрокам, а не удаляется. Так легче для сервера.

bgn.settings.spawn.actors_max_teleports=Переносов в секунду
bgn.settings.spawn.actors_max_teleports.help=Больше — город заполняется быстрее, но сервер нагружается сильнее.

bgn.settings.spawn.fasted_teleport=Быстрая проверка
bgn.settings.spawn.fasted_teleport.help=Чаще проверяет, кого убрать или перенести. Город живее, но сервер нагружается сильнее.
