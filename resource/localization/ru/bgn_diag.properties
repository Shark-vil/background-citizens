bgn.diag.cvar_server.lost=Вы администратор, но изменение не дошло до сервера. Возможно, другой аддон блокирует сетевую строку bgn_net.
bgn.diag.cvar_client.ok=Клиентская настройка меняется без проблем.
bgn.diag.cvar_client.fail=Клиентская настройка не изменилась. Возможно, другой аддон перехватывает консольные команды.
bgn.diag.spawn_natural.exist=Актёры уже ходят по карте: %d.
bgn.diag.spawn_natural.ok=Актёры появляются сами: новых появилось %d.
bgn.diag.spawn_natural.none=За %d с не появился ни один актёр. Вероятная причина: %s.
bgn.diag.reason.disabled=аддон выключен (bgn_enable)
bgn.diag.reason.max0=общий лимит актёров равен 0
bgn.diag.reason.types=все типы актёров выключены или у них нулевой лимит
bgn.diag.reason.nonav=на карте нет навигационных точек
