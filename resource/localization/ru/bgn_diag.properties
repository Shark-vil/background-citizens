bgn.diag.states.ok=Проверено актёров: %d, их состояния в порядке.
bgn.diag.states.none=Нет актёров для проверки.
bgn.diag.states.broken=Актёров с ошибками: %d из %d. См. лог.
bgn.diag.states.switch=Актёр не принял состояние "%s".
bgn.diag.states.still=Не двигались %d из %d идущих актёров. Возможно, они застряли.
