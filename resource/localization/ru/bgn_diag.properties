bgn.diag.rights.server=Сервер не считает вас администратором (ваша группа: %s). Поэтому серверные настройки не меняются. Выдайте себе права администратора на сервере.
bgn.diag.rights.client=Сервер считает вас администратором (%s), но ваша игра об этом ещё не знает. Перезайдите или заново откройте меню.
