bgn.diag.section=Тестирование
bgn.diag.run=Запустить полный тест
bgn.diag.run.help=Создаёт тестовых актёров и машину, наблюдает за ними и показывает, где собираются толпы. Занимает около минуты; на время камеры вы защищены. Только для админов.
bgn.diag.run_settings=Проверить только права и настройки
bgn.diag.run_settings.help=Быстрая проверка, почему настройки могут не меняться: ваши права админа, тестовое серверное и тестовое клиентское значение. Доступно всем.
bgn.diag.report=Результаты последнего теста
bgn.diag.report.help=Открывает последние результаты снова, с кнопкой копирования полного лога.
bgn.diag.cvar_server=Тестовое серверное значение
bgn.diag.cvar_server.help=Меняйте вручную: это обычная серверная настройка, которая ничего не делает. Если она не меняется, остальные тоже не изменятся.
bgn.diag.cvar_client=Тестовое клиентское значение
bgn.diag.cvar_client.help=Обычная клиентская настройка, которая ничего не делает. Меняется у всех.
bgn.diag.note=Тестирование проверяет, что актёры появляются и живут, машины работают, а настройки можно менять. Приложите скопированный лог к сообщению об ошибке.

bgn.diag.results=Результаты теста
bgn.diag.count.ok=Пройдено: %d
