bgn.menu.section.generation=Генерация точек
bgn.menu.brain=Принятие решений
bgn.menu.brain.help=FSM — проще и легче для сервера. GOAP — умнее в бою. Авто выбирает само.
bgn.menu.body=Тело актёра
bgn.menu.body.help=NPC — обычные NPC игры, как в старых версиях. Другие аддоны для NPC (реплейсеры, ragdoll-моды, Bio-Annihilation 2) их видят. NextBot — ходят плавнее, нужен навмеш, такие аддоны с ними могут не работать. Действует на новых NPC.
bgn.menu.pick_up_weapons=Актёры подбирают оружие
bgn.menu.pick_up_weapons.help=Безоружный актёр в опасности бежит к лежащему рядом оружию, берёт его и дерётся. Выкл — как раньше.
bgn.menu.enemy_share_period=Период передачи врагов (с)
bgn.menu.enemy_share_period.help=Раз в N секунд актёр, у которого есть враг, сообщает о нём своим, кто его видит и вокруг, чтобы они тоже реагировали. 0 — выкл.
bgn.menu.fight_cooldown=Задержка между стычками
bgn.menu.fight_cooldown.help=Секунды после начала стычки, в течение которых ближайшие актёры игнорируют призывы защитить своих от другого нападающего. Идущие бои и нападения игрока или NPC из других модов не затрагиваются. 0 - выключено.
bgn.menu.nextbot_jump=Прыжки NextBot
bgn.menu.nextbot_jump.help=NextBot-актёры прыгают, когда застряли и когда их сбивает машина. Выкл — застрявший ждёт и телепортируется к следующей точке пути.
bgn.menu.replics_language=Язык реплик
bgn.menu.replics_language.help=На каком языке говорят актёры.
bgn.menu.nav_provider=Источник движения
bgn.menu.nav_provider.help=Откуда NPC берут точки для ходьбы. Авто выбирает лучшее.
bgn.menu.nav_custom=Своя сетка
bgn.menu.point_z_limit=Высота между точками
bgn.menu.point_z_limit.help=Наибольшая разница высот, при которой две точки соединяются.
bgn.menu.nav_max_nodes=Лимит генерируемых точек
bgn.menu.nav_max_nodes.help=Сколько точек генератор создаёт максимум. Больше — лучше покрытие, но больше памяти.
bgn.menu.lod_near_radius=Радиус полного обновления
bgn.menu.lod_near_radius.help=Ближе этого расстояния или на виду у игрока NPC думают в полную силу, дальше — реже.
bgn.menu.draw_npc_path=Показывать пути NPC
bgn.menu.draw_npc_path.help=Рисует, куда идут NPC.

bgn.menu.page.other_works=Другие работы
bgn.menu.works.header=Возможно, вам будет интересно?
bgn.menu.works.loading=Загрузка...
bgn.menu.works.failed=Не удалось загрузить список работ. Попробуйте позже.
bgn.menu.works.subscribe=Подписаться
bgn.menu.works.subscribed=Вы подписаны
bgn.menu.section.experimental=Экспериментальное
bgn.menu.ghost_crowd=Призрачная толпа (ЭКСПЕРИМЕНТАЛЬНО)
bgn.menu.ghost_crowd.help=Вдали появляются фигуры-призраки, которые повторяют поведение NPC рядом и исчезают, когда вы подходите. Нагружает только ваш компьютер.
bgn.menu.ghost_crowd_max=Сколько призраков
bgn.menu.ghost_crowd_max.help=Больше — город живее, но ниже FPS.
bgn.menu.ghost_crowd_server=Серверная призрачная толпа (ЭКСПЕРИМЕНТАЛЬНО)
bgn.menu.ghost_crowd_server.help=Призраками управляет сервер: все игроки видят одних и тех же, а призрак, к которому подошёл игрок, становится настоящим NPC на своём месте. Настройки призраков у игроков тогда не действуют.
bgn.menu.ghost_crowd_server_max=Сколько серверных призраков
bgn.menu.ghost_crowd_server_max.help=Не больше стольких одновременно, на всех игроков.
bgn.menu.by_server=Управляется сервером
bgn.menu.ghost_crowd.by_server=Управляет сервер: он ведёт одних и тех же призраков для всех игроков.
bgn.menu.group.server=Сервер
bgn.menu.group.client=Только у вас
bgn.menu.section.graphics=Графика и звук
bgn.menu.section.wanted=Розыск
bgn.menu.section.debug=Отладка
bgn.menu.section.about=Об аддоне
bgn.menu.actor.max=Сколько на карте
bgn.menu.actor.wanted=Розыск %d+
bgn.menu.actor.wanted.help=Работает с розыском: вызывается с %d уровня. Если розыск (или рост уровня) выключен, появляется как обычный NPC.
bgn.menu.actor.no_weapons=Без оружия
bgn.menu.actor.max_vehicles=Машин на карте
bgn.menu.actor.max_vehicles.help=Сколько машин с ними может ездить одновременно.
bgn.settings.workshop.save_to_script.help=Упаковывает сетку, сиденья и пути DV в Lua-файл для публикации.
bgn.settings.actor.total_max_npc=Всего NPC на карте
bgn.settings.actor.total_max_npc.help=Сколько фоновых NPC может быть одновременно.

bgn.menu.group.other=Ещё

bgn.menu.ui_language=Язык интерфейса
bgn.menu.ui_language.help=Язык этого меню и подсказок. «Авто» — как в игре. У фраз NPC своя настройка.
bgn.menu.ui_scale=Размер интерфейса
bgn.menu.ui_scale.help=Увеличивает или уменьшает текст и элементы этого меню. 1 — по высоте экрана.
bgn.menu.voice_language=Язык фраз NPC
bgn.menu.voice_language.help=Язык фраз над головами NPC и их голосов. «Авто» — как в игре. Сервер может задать один язык для всех.
bgn.menu.section.doors=Двери
bgn.menu.section.corpses=Трупы
bgn.menu.corpse_cleanup=Убирать трупы
bgn.menu.corpse_cleanup.help=Тела погибших NPC через время исчезают. Если к телу едет медик или его осматривает полицейский, тело дождётся их. npc_battle_cleanup эти тела не трогает.
bgn.menu.corpse_cleanup_time=Тело лежит, секунд
bgn.menu.corpse_cleanup_time.help=Через сколько секунд после смерти тело исчезает.
bgn.menu.section.medics=Медики
bgn.menu.medic_danger_time=Запрет выезда после убийства медика, секунд
bgn.menu.medic_danger_time.help=Медики не появляются и не выезжают в опасную зону до истечения времени или смерти убийцы. 0 — отключить запрет.
bgn.menu.medic_danger_radius=Радиус опасной зоны для медиков
bgn.menu.medic_danger_radius.help=Расстояние от места убийства медика, в котором временно запрещены появление и выезды медиков.
bgn.menu.medic_hopeless_chance=Шанс безнадёжной смерти
bgn.menu.medic_hopeless_chance.help=Доля обычных смертей, которые медики не могут спасти. Взрывы и выстрелы в упор всегда безнадёжны.
bgn.menu.section.crowd_density=Плотность толпы
bgn.menu.section.scenic=Сценические NPC
bgn.menu.scenic=Сценки на улицах
bgn.menu.scenic.help=Очередь, арест, пара на диване, кто-то прислонился к стене: небольшие сценки появляются там, где для них есть место (стена, дверь, стул). Выстрел или удар заставляет людей уйти из сценки.
bgn.menu.scenic_max=Сценок одновременно
bgn.menu.scenic_max.help=Сколько сценок может быть на карте одновременно. 0 - нет.
bgn.menu.scenic_period=Секунд между попытками
bgn.menu.scenic_period.help=Как часто мод пытается поставить на карту новую сценку. Сценка, для которой на этой карте нет места, ждёт всё дольше.
bgn.menu.crowd_density=Плотность толпы
bgn.menu.crowd_density.help=Одна настройка под мощность компьютера: сколько NPC и призраков на карте. Админ меняет серверные лимиты и своих призраков; остальные игроки меняют только своих призраков, и только пока сервер не ведёт фоновую толпу. Если лимиты изменены вручную, ни один пресет не выбран.
bgn.menu.crowd_density.by_server=Управляет сервер: вы не админ, а сервер ведёт призраков для всех игроков.
bgn.menu.crowd_density.low=Низкая
bgn.menu.crowd_density.medium=Средняя
bgn.menu.crowd_density.high=Высокая
bgn.menu.crowd_density.ultra=Ультра
bgn.wizard.step=Шаг %d из %d
bgn.wizard.back=Назад
bgn.wizard.next=Далее
bgn.wizard.done=Готово
bgn.wizard.skip=Пропустить настройку
bgn.wizard.density=Сколько людей на улицах
bgn.wizard.density.desc=Выберите, сколько людей будет ходить по городу. Чем их больше, тем живее город, но тем сильнее нагрузка на компьютер. Если игра тормозит, выберите «Мало» или «Средне».
bgn.wizard.density.label=Сколько людей в городе
bgn.wizard.density.low=Мало
bgn.wizard.density.medium=Средне
bgn.wizard.density.high=Много
bgn.wizard.density.ultra=Очень много
bgn.wizard.density.l1=Мало
bgn.wizard.density.l2=Очень много
bgn.wizard.body=Какие у людей тела
bgn.wizard.body.desc=Обычные: стандартные персонажи игры. Выбирайте их, если у вас есть другие моды, которые меняют NPC, или если компьютер слабый. NextBot: новые персонажи этого мода, они ходят плавнее и обходят препятствия, но другие моды на NPC на них могут не работать. Не уверены? Оставьте «Обычные».
bgn.wizard.body.label=Тип людей
bgn.wizard.body.npc=Обычные
bgn.wizard.body.nextbot=NextBot (новые)
bgn.wizard.body.l1=Обычные
bgn.wizard.body.l2=NextBot
bgn.wizard.brain=Как люди ведут себя в бою
bgn.wizard.brain.desc=Простое: люди просто убегают или дерутся, игре легче. Умное: люди прячутся за укрытиями, обходят вас и выбирают лучшее действие, но компьютеру тяжелее. «Авто» выберет за вас.
bgn.wizard.brain.label=Поведение в бою
bgn.wizard.brain.auto=Авто
bgn.wizard.brain.fsm=Простое
bgn.wizard.brain.goap=Умное
bgn.wizard.brain.l1=Простое
bgn.wizard.brain.l2=Умное
bgn.wizard.ghosts=Люди вдалеке
bgn.wizard.ghosts.desc=Далеко от вас вместо настоящих людей показываются лёгкие «призраки»: фигуры, которые повторяют то, что делают настоящие люди. Когда вы подходите, они становятся настоящими. Так город выглядит заполненным, а игра почти не тормозит. Функция ещё экспериментальная.
bgn.wizard.ghosts.c1=Далёкие люди на сервере (для всех игроков)
bgn.wizard.ghosts.c2=Показывать далёких людей мне
bgn.wizard.ghosts.l1=Выкл
bgn.wizard.ghosts.l2=Вкл
bgn.wizard.scenic=Сценки на улицах
bgn.wizard.scenic.desc=По городу появляются небольшие сценки: очередь за едой, полицейский задерживает человека, пара сидит на диване, кто-то стучится в дверь. Если выстрелить или ударить, люди разбегутся.
bgn.wizard.scenic.c1=Показывать сценки
bgn.wizard.scenic.c2=Сколько сценок сразу
bgn.wizard.scenic.l1=Выкл
bgn.wizard.scenic.l2=Вкл
bgn.wizard.wanted=Розыск и полиция
bgn.wizard.wanted.desc=Если вы нападёте на человека, свидетели вызовут полицию. Чем дольше вы нарушаете закон, тем сильнее вас ищут. Если включён арест, полиция сначала попробует вас задержать, а не стрелять.
bgn.wizard.wanted.c1=Вызывать полицию, если вы нападаете
bgn.wizard.wanted.c2=Полиция сначала пытается задержать
bgn.wizard.wanted.c3=Сколько секунд вас ищут
bgn.wizard.voices=Голоса и звуки
bgn.wizard.voices.desc=Люди кричат, зовут полицию и разговаривают друг с другом. Здесь можно выключить голоса или шум улицы. Шум улицы слышен, когда рядом много людей.
bgn.wizard.voices.c1=Голоса людей
bgn.wizard.voices.c2=Шум улицы
bgn.wizard.vehicles=Машины на дорогах
bgn.wizard.vehicles.desc=Если установить дополнение Decent Vehicle, люди будут ездить на машинах по дорогам и уступать друг другу. Без него машин не будет. Чтобы установить, нажмите «Подписаться» ниже.
bgn.wizard.vehicles.c1=Машины на дорогах
bgn.wizard.vehicles.l1=Выкл
bgn.wizard.vehicles.l2=Вкл
bgn.wizard.vehicles.dv.desc=Дополнение, без которого машины не ездят.
bgn.wizard.vehicles.pack.desc=Машины для города: simfphys, машины из GTA San Andreas и поддержка Background NPCs. Одна кнопка подписывает сразу на все три. Можно взять и другие моды на машины.
bgn.wizard.vehicles.required=нужно
bgn.wizard.vehicles.optional=по желанию
bgn.wizard.title=Пошаговая настройка
bgn.wizard.vehicles.dv=Decent Vehicle
bgn.wizard.vehicles.pack=Пак машин
bgn.menu.quick=Быстрые настройки
bgn.menu.quick.help=Не знаете, что менять? Пройдите настройки по шагам.
bgn.menu.quick.wizard=Пошаговая настройка
bgn.menu.admin_only=Эти настройки только для администраторов.
bgn.classic.applied=Классическая настройка включена: обычные NPC, старый мозг, без призрачной толпы. NPC, которые уже на карте, не меняются; для чистого старта перезагрузите карту.
bgn.classic.tip=НАПИШИТЕ %s ЕСЛИ ВАМ НУЖНО СТАРОЕ ПОВЕДЕНИЕ

bgn.menu.new_menu=★ Новое меню настроек
bgn.menu.open_new=Открыть новое меню настроек
bgn.version.latest=Версия %s: актуальная.
bgn.version.dev=Версия %s: для разработчиков (последний релиз: %s).
bgn.version.outdated=Доступно обновление: %s (у вас: %s). Подробности: bgn_updateinfo
bgn.version.upgraded=Обновлено: %s → %s.

bgn.menu.actor.carry_items=Спавнить с предметами в руках
bgn.menu.actor.carry_items.help=Разрешает шанс предмета из конфига этого типа акторов. Влияет на новых акторов и призрачных жителей.
