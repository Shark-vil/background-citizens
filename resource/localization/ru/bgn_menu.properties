bgn.menu.section.experimental=Экспериментальное
bgn.menu.ghost_crowd=Призрачная толпа (ЭКСПЕРИМЕНТАЛЬНО)
bgn.menu.ghost_crowd.help=Вдали появляются фигуры-призраки, которые повторяют поведение NPC рядом и исчезают, когда вы подходите. Нагружает только ваш компьютер. Если призраками управляет сервер, опция только показывает или скрывает их.
bgn.menu.ghost_crowd_max=Сколько призраков
bgn.menu.ghost_crowd_max.help=Больше — город живее, но ниже FPS. Не действует, если призраками управляет сервер.
bgn.menu.ghost_crowd_server=Серверная призрачная толпа (ЭКСПЕРИМЕНТАЛЬНО)
bgn.menu.ghost_crowd_server.help=Призраками управляет сервер: все игроки видят одних и тех же, а призрак, к которому подошёл игрок, становится настоящим NPC на своём месте. Настройки призраков у игроков тогда только показывают или скрывают их.
bgn.menu.ghost_crowd_server_max=Сколько серверных призраков
bgn.menu.ghost_crowd_server_max.help=Не больше стольких одновременно, на всех игроков.
