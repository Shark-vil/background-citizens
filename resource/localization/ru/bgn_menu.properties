bgn.menu.brain.help=FSM — проще и легче для сервера. GOAP — умнее в бою. Авто выбирает само.
bgn.menu.body=Тело актёра
bgn.menu.body.help=NPC — обычные NPC игры. NextBot — ходят плавнее, нужен навмеш. Авто выбирает само. Действует на новых NPC.
bgn.menu.replics_language=Язык реплик
bgn.menu.replics_language.help=На каком языке говорят актёры.
bgn.menu.nav_provider=Источник движения
