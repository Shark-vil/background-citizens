bgn.settings.spawn=Spawner

bgn.settings.spawn.spawn_radius=Spawn radius
bgn.settings.spawn.spawn_radius.help=How far from players NPCs appear.

bgn.settings.spawn.spawn_radius_visibility=Visibility radius
bgn.settings.spawn.spawn_radius_visibility.help=How far players watch the city. Used for: a wanted NPC (not a player) drops its wanted level after 15 seconds outside every player's field of view or farther than half of this radius. Obstacles don't matter.

bgn.settings.spawn.vehicle_spawn_visibility_radius=Vehicle spawn exclusion in front of players
bgn.settings.spawn.vehicle_spawn_visibility_radius.help=Within this distance in front of any player DV vehicles spawn only if the whole car is hidden behind cover. Does not affect regular NPCs.

bgn.settings.spawn.actor_unseen_time=Time out of sight
bgn.settings.spawn.actor_combat_radius=Combat radius
bgn.settings.spawn.actor_combat_radius.help=Keep fighting actors while any living enemy is within this distance, even out of sight. Prevents population removal/teleport and NextBot unstuck teleports. Default: 1000. 0 disables radius protection.
bgn.settings.spawn.actor_unseen_time.help=Seconds without any player seeing an NPC before it may be teleported or removed. Checks view direction and obstacles. Protected NPCs and busy scenes are preserved. 0 means no delay.

bgn.settings.spawn.spawn_block_radius=No spawning closer than
bgn.settings.spawn.spawn_block_radius.help=NPCs don't appear closer than this to a player. 0 - off.

bgn.settings.spawn.spawn_period=Spawn delay
bgn.settings.spawn.spawn_period.help=Pause in seconds between spawner passes. Each pass attempts to create one NPC per eligible type. Changes apply immediately.

bgn.settings.spawn.actors_teleporter=Move instead of removing
bgn.settings.spawn.actors_teleporter.help=An NPC nobody sees is moved closer to players instead of being removed. Easier on the server.

bgn.settings.spawn.actors_max_teleports=Moves per second
bgn.settings.spawn.actors_max_teleports.help=More fills the city faster but loads the server more.

bgn.settings.spawn.fasted_teleport=Fast check
bgn.settings.spawn.fasted_teleport.help=Checks more often whom to remove or move. The city feels busier, the server works harder.
