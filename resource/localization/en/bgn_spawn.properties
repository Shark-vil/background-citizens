bgn.settings.spawn=Spawn settings

bgn.settings.spawn.spawn_radius=Spawn radius
bgn.settings.spawn.spawn_radius.help=How far from players NPCs appear.

bgn.settings.spawn.spawn_radius_visibility=Removal radius
bgn.settings.spawn.spawn_radius_visibility.help=NPCs farther than this are removed or moved closer to players.

bgn.settings.spawn.spawn_block_radius=No spawning closer than
bgn.settings.spawn.spawn_block_radius.help=NPCs don't appear closer than this to a player. 0 - off.

bgn.settings.spawn.spawn_period=Spawn delay
bgn.settings.spawn.spawn_period.help=Seconds between NPC spawns. Takes effect after a map restart.

bgn.settings.spawn.actors_teleporter=Move instead of removing
bgn.settings.spawn.actors_teleporter.help=An NPC nobody sees is moved closer to players instead of being removed. Easier on the server.

bgn.settings.spawn.actors_max_teleports=Moves per second
bgn.settings.spawn.actors_max_teleports.help=More fills the city faster but loads the server more.

bgn.settings.spawn.fasted_teleport=Fast check
bgn.settings.spawn.fasted_teleport.help=Checks more often whom to remove or move. The city feels busier, the server works harder.
