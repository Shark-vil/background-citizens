bgn.diag.section=Testing
bgn.diag.run=Run the full test
bgn.diag.run.help=Spawns test actors and a car, watches them and shows where the crowds gather. Takes about a minute; you are protected during the camera. Admins only.
bgn.diag.run_settings=Check rights and settings only
bgn.diag.run_settings.help=Quick check of why settings may not change: your admin rights, a test server value and a test client value. Anyone can run it.
bgn.diag.report=Results of the last test
bgn.diag.report.help=Opens the last results again, with the button that copies the full log.
bgn.diag.cvar_server=Test server value
bgn.diag.cvar_server.help=Change it by hand: it is an ordinary server setting that does nothing. If it won't change, neither will the others.
bgn.diag.cvar_client=Test client value
bgn.diag.cvar_client.help=An ordinary client setting that does nothing. It always changes for everyone.
bgn.diag.note=Testing checks that actors spawn and live, that cars work and that settings can be changed. Attach the copied log to a bug report.

bgn.diag.results=Test results
bgn.diag.count.ok=%d passed
bgn.diag.count.warn=%d warnings
bgn.diag.count.fail=%d failed
bgn.diag.copy=Copy log
bgn.diag.copied=The test log is copied to the clipboard
bgn.diag.again=Run again
bgn.diag.log_hint=The log holds all the technical details. Paste it into your bug report. A copy is saved to data/background_npcs/test_report.txt.
bgn.diag.no_report=There are no test results yet
bgn.diag.no_answer=The server did not answer the test
bgn.diag.busy=A test is already running
bgn.diag.starting=Starting the test...
bgn.diag.progress=Test %d of %d: %s
bgn.diag.skip_camera=Space: skip the camera. Stop: bgn_test_stop
bgn.diag.stop_hint=Don't move: the test is running. Stop: bgn_test_stop
bgn.diag.cam.group=Group %d of %d: %d actors

bgn.diag.t.env=Addon and map
bgn.diag.t.rights=Admin rights
bgn.diag.t.cvar_server=Changing server settings
bgn.diag.t.cvar_client=Changing client settings
bgn.diag.t.spawn_natural=Actors spawn on their own
bgn.diag.t.spawn_forced=Actors spawn on demand
bgn.diag.t.vehicles=Cars (Decent Vehicle)
bgn.diag.t.persist=Actors don't vanish
bgn.diag.t.states=Actor states
bgn.diag.t.crowd=Where the actors are

bgn.diag.lua_error=The test crashed: %s
bgn.diag.env.ok=The addon is on. Navigation: %s, %d points.
bgn.diag.env.disabled=The addon is switched off (bgn_enable is 0), so nothing spawns by itself.
bgn.diag.env.nonav=The map %s has no navigation points: the actors have nowhere to walk. Use a map with a navmesh or load route points.
bgn.diag.rights.ok=Admin rights are fine (group: %s).
bgn.diag.rights.server=The server does not see you as an admin (your group: %s). That is why server settings don't change. Give yourself admin rights on the server.
bgn.diag.rights.client=The server sees you as an admin (%s), but your game doesn't know it yet. Reconnect or reopen the menu.
bgn.diag.cvar_server.ok=A server setting was changed and confirmed in %d ms.
bgn.diag.cvar_server.nosync=The server accepted the change, but the new value did not come back to your game.
bgn.diag.cvar_server.noreport=Your game did not answer the test. Look for Lua errors in the client console.
bgn.diag.cvar_server.server_denied=The change was rejected: the server does not treat your group (%s) as admin.
bgn.diag.cvar_server.client_denied=Your game did not send the change: it doesn't consider you an admin.
bgn.diag.cvar_server.lost=You are an admin, but the change never reached the server. Another addon may be blocking the network string bgn_net.
bgn.diag.cvar_client.ok=A client setting changes without problems.
bgn.diag.cvar_client.fail=A client setting did not change. Another addon may be overriding console commands.
bgn.diag.spawn_natural.exist=Actors are already walking around: %d.
bgn.diag.spawn_natural.ok=Actors spawn on their own: %d new ones appeared.
bgn.diag.spawn_natural.none=No actor appeared in %d s. Most likely reason: %s.
bgn.diag.reason.disabled=the addon is switched off (bgn_enable)
bgn.diag.reason.max0=the total actor limit is 0
bgn.diag.reason.types=every actor type is switched off or has a zero limit
bgn.diag.reason.nonav=the map has no navigation points
bgn.diag.reason.nopoints=there are no navigation points near you (increase the spawn radius)
bgn.diag.reason.nohidden=every spot near you is in your view or too close (lower the block radius or the visibility radius)
bgn.diag.reason.unknown=the settings look fine, so another addon may block the spawns (see the log)
bgn.diag.spawn_forced.ok=Spawn on demand works: %d actor types appeared.
bgn.diag.spawn_forced.some=Only %d of %d actor types could be spawned. See the log.
bgn.diag.spawn_forced.none=None of %d actor types could be spawned. See the log for the errors.
bgn.diag.spawn_forced.nospot=No free spot was found around you to spawn the test actors.
bgn.diag.spawn_forced.notypes=No actor type is available for the test.
bgn.diag.vehicles.nodv=Decent Vehicle is not installed, so there are no cars. This is optional.
bgn.diag.vehicles.off=Car support is switched off in the settings (Addons, Decent Vehicle).
bgn.diag.vehicles.nowaypoints=Decent Vehicle is installed, but this map has no routes for cars.
bgn.diag.vehicles.noclasses=The car models of the actors are missing: %d of %d are installed.
bgn.diag.vehicles.nodriver=The driver (%s) could not be spawned.
bgn.diag.vehicles.nocar=A car for the %s could not be spawned: there is no road point in range or the limit is reached.
bgn.diag.vehicles.notseated=The car appeared, but the %s did not get in.
bgn.diag.vehicles.ok=A car appeared and the %s drives it.
bgn.diag.persist.ok=All %d spawned actors stayed alive for %d s.
bgn.diag.persist.lost=%d of %d spawned actors or cars vanished within %d s.
bgn.diag.persist.none=Nothing to check: no actor was spawned.
bgn.diag.states.ok=%d actors checked, their states are fine.
bgn.diag.states.none=There are no actors to check.
bgn.diag.states.broken=%d of %d actors are broken. See the log.
bgn.diag.states.switch=An actor did not accept the state "%s".
bgn.diag.states.still=%d of %d walking actors did not move. They may be stuck.
bgn.diag.crowd.ok=The camera showed %d of %d groups of actors.
bgn.diag.crowd.none=There are no actors to show.
bgn.diag.cvar_server.shared=The value changed, but this is a single player or listen server game: the game and the server share settings, so this check cannot show whether your rights are enough.
bgn.diag.fix=Fix
bgn.diag.fixed=Fixed
bgn.diag.fix_done=Settings changed. Run the test again to check.
bgn.diag.fix.enable=Switches the addon on (bgn_enable)
bgn.diag.fix.limit=Restores the default total actor limit
bgn.diag.fix.types=Switches on the default actor types and restores their limits
bgn.diag.fix.radius=Restores the default spawn radius
bgn.diag.fix.hidden=Restores the default block and visibility radii
bgn.diag.fix.cars=Switches car support on (Decent Vehicle)
