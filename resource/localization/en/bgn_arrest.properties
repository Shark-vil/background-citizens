bgn.settings.arrest=Arrest mode

bgn.settings.arrest.arrest_mode=Enable arrest
bgn.settings.arrest.arrest_mode.help=The police try to arrest first. Works in DarkRP.

bgn.settings.arrest.arrest_time_limit=Time to give up
bgn.settings.arrest.arrest_time_limit.help=Seconds the police wait for you to give up. Then they shoot.

bgn.settings.arrest.arrest_time=Arrest time
bgn.settings.arrest.arrest_time.help=How many seconds the arrest takes.

bgn.settings.arrest.surrender_delay=Second chance to give up
bgn.settings.arrest.surrender_delay.help=Seconds without hurting anyone, holding no weapons (or only safe ones like the physgun or fists), after which the police offer an arrest again even after a shootout. 0 turns it off.