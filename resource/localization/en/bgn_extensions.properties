bgn.settings.extension=Extensions

bgn.settings.extension.drop_money=Money from NPCs
bgn.settings.extension.drop_money.help=NPCs drop money when they die.

bgn.settings.extension.disable_dialogues=No conversations
bgn.settings.extension.disable_dialogues.help=NPCs don't talk to each other.

bgn.settings.extension.shot_sound_mode=React to gunshot sounds (EXPERIMENTAL)
bgn.settings.extension.shot_sound_mode.help=NPCs get scared by any nearby shot. May work badly.

bgn.settings.extension.all_models_random=Random models
bgn.settings.extension.all_models_random.help=NPCs use any model from the game.

bgn.settings.extension.replics_enable=Lines above heads
bgn.settings.extension.replics_enable.help=Text of what NPCs say.

bgn.settings.extension.custom_gestures=Advanced Animations (EXPERIMENTAL)
bgn.settings.extension.custom_gestures.help=NPCs dance and do more things. Turn off if something breaks.

bgn.settings.extension.tactical_groups=Squads
bgn.settings.extension.tactical_groups.help=Police, special forces and gangs fight as squads and keep formation.

bgn.settings.extension.react_to_lethal_weapon=React to weapons in hands
bgn.settings.extension.react_to_lethal_weapon.help=Residents and police react to learned lethal weapons within 800 units, with LOS and FOV checks once per second. Off by default; weapon learning continues while off.
bgn.settings.extension.threat_search=Panic and threat search
bgn.settings.extension.threat_search.help=An ally who sees a kill but not the killer reacts: residents panic and hide, police and gangs search the area. The killer is recognized by the weapon in hand (any holder of the same weapon), seen 3 times in a row within 500 units in the field of view. Witnesses need no field of view: a clear line from the victim is enough. Off by default.
