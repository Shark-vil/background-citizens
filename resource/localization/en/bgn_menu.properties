bgn.menu.quick.help=Not sure what to change? Go through the settings step by step.
bgn.menu.quick.wizard=Step by step setup
bgn.menu.admin_only=These settings are only for admins.
bgn.classic.applied=Classic setup enabled: NPC body, old brain, no ghost crowd. NPCs already on the map stay as they are; reload the map for a clean start.
bgn.classic.tip=TYPE %s IF YOU WANT THE OLD BEHAVIOR

