bgn.menu.section.ai=Artificial intelligence
bgn.menu.section.generation=Point generation
bgn.menu.brain=Decision making
bgn.menu.brain.help=FSM is simpler and lighter. GOAP is smarter in a fight. Auto picks for you.
bgn.menu.body=Actor body
bgn.menu.body.help=NPC: regular game NPCs, like in the old versions. Other addons that work with NPCs (replacers, ragdoll mods, Bio-Annihilation 2) see them. NextBot: smoother walking, needs a navmesh, such addons may not work with it. Applies to new NPCs.
bgn.menu.pick_up_weapons=Actors pick up dropped weapons
bgn.menu.pick_up_weapons.help=An unarmed actor in danger runs to a weapon lying nearby, takes it and fights. Off is the old behavior.
bgn.menu.enemy_share_period=Enemy sharing period (s)
bgn.menu.enemy_share_period.help=Every N seconds an actor that fights someone tells the teammates around it who see it about the enemy, so they react too. 0 - off.
bgn.menu.fight_cooldown=Delay between skirmishes
bgn.menu.fight_cooldown.help=Seconds after a skirmish starts during which actors nearby ignore calls to protect their own against another attacker. Fights already going and attacks by a player or by NPCs of other mods are not affected. 0 - off.
bgn.menu.nextbot_jump=NextBot jumps
bgn.menu.nextbot_jump.help=NextBot actors jump when stuck and when a car hits them. Off: a stuck actor waits and then teleports to the next path point.
bgn.menu.replics_language=Phrases language
bgn.menu.replics_language.help=The language of the phrases actors say.
bgn.menu.nav_provider=Movement source
bgn.menu.nav_provider.help=Where NPCs get their walking points. Auto picks the best.
bgn.menu.nav_custom=Own mesh
bgn.menu.point_z_limit=Height between points
bgn.menu.point_z_limit.help=The largest height difference for two points to be linked.
bgn.menu.nav_max_nodes=Generated points limit
bgn.menu.nav_max_nodes.help=The most points the generator makes. More covers better but uses more memory.
bgn.menu.lod_near_radius=Full update radius
bgn.menu.lod_near_radius.help=Closer than this or in sight of a player, NPCs think fully; farther, less often.
bgn.menu.draw_npc_path=Show NPC paths
bgn.menu.draw_npc_path.help=Draws where NPCs are walking.

bgn.menu.page.other_works=Other works
bgn.menu.works.header=You might find these interesting
bgn.menu.works.loading=Loading...
bgn.menu.works.failed=Couldn't load the list of works. Try again later.
bgn.menu.works.subscribe=Subscribe
bgn.menu.works.subscribed=Subscribed
bgn.menu.section.experimental=Experimental
bgn.menu.ghost_crowd=Ghost crowd (EXPERIMENTAL)
bgn.menu.ghost_crowd.help=Ghost figures far away copy what nearby NPCs do and vanish when you come close. Only your computer does the work.
bgn.menu.ghost_crowd_max=How many ghosts
bgn.menu.ghost_crowd_max.help=More makes the city livelier but lowers FPS.
bgn.menu.ghost_crowd_server=Server ghost crowd (EXPERIMENTAL)
bgn.menu.ghost_crowd_server.help=The server runs the ghosts: every player sees the same ones, and a ghost a player walks up to becomes a real NPC on its spot. The players' own ghost settings then do nothing.
bgn.menu.ghost_crowd_server_max=How many server ghosts
bgn.menu.ghost_crowd_server_max.help=The most at once, shared between the players.
bgn.menu.by_server=Controlled by the server
bgn.menu.ghost_crowd.by_server=Controlled by the server: it runs the same ghosts for every player.
bgn.menu.group.server=Server
bgn.menu.group.client=Only for you
bgn.menu.section.graphics=Graphics and sound
bgn.menu.section.wanted=Wanted
bgn.menu.section.debug=Debug
bgn.menu.section.about=About
bgn.menu.actor.max=How many on the map
bgn.menu.actor.wanted=Wanted %d+
bgn.menu.actor.wanted.help=Works with the wanted system: called in from wanted level %d. With the wanted mode (or level growth) off it spawns like a regular NPC.
bgn.menu.actor.no_weapons=No weapons
bgn.menu.actor.max_vehicles=Cars on the map
bgn.menu.actor.max_vehicles.help=How many of their cars can drive at once.
bgn.settings.workshop.save_to_script.help=Packs the mesh, seats and DV waypoints into a Lua file to publish.
bgn.settings.actor.total_max_npc=NPCs on the map in total
bgn.settings.actor.total_max_npc.help=How many background NPCs can exist at once.

bgn.menu.group.other=More

bgn.menu.ui_language=Interface language
bgn.menu.ui_language.help=Language of this menu and its hints. Auto follows the game language. NPC phrases have their own setting.
bgn.menu.ui_scale=Interface size
bgn.menu.ui_scale.help=Makes the text and controls of this menu bigger or smaller. 1 follows the screen height.
bgn.menu.voice_language=NPC phrases language
bgn.menu.voice_language.help=Language of the phrases over the NPCs' heads and of their voices. Auto follows the game language. A server may force one language for everyone.
bgn.menu.section.doors=Doors
bgn.menu.section.corpses=Bodies
bgn.menu.corpse_cleanup=Remove bodies
bgn.menu.corpse_cleanup.help=The bodies of dead NPCs fade out after a while. A medic or an officer busy with a body gets their time first. Bodies of these NPCs are not touched by npc_battle_cleanup.
bgn.menu.corpse_cleanup_time=Body stays, seconds
bgn.menu.corpse_cleanup_time.help=How long after the death a body fades out.
bgn.menu.section.medics=Medics
bgn.menu.medic_danger_time=Avoid area after a medic is killed, seconds
bgn.menu.medic_danger_time.help=Medics cannot spawn or answer calls in the danger area until the timer expires or the killer dies. 0 disables the restriction.
bgn.menu.medic_danger_radius=Medic danger area radius
bgn.menu.medic_danger_radius.help=Distance around a killed medic where medic spawns and responses are temporarily blocked.
bgn.menu.medic_hopeless_chance=Hopeless death chance
bgn.menu.medic_hopeless_chance.help=Percent of ordinary deaths the medics cannot save. Explosions and point-blank shots are always hopeless.
bgn.menu.section.crowd_density=Crowd density
bgn.menu.section.scenic=Scenic NPCs
bgn.menu.scenic=Staged scenes
bgn.menu.scenic.help=People in a queue, an arrest, a couple on a couch, someone leaning on a wall: small scenes appear in places that fit them (a wall, a door, a chair). A shot or a hit makes the people leave the scene.
bgn.menu.scenic_max=Scenes at once
bgn.menu.scenic_max.help=The most scenes on the map at the same time. 0 - none.
bgn.menu.scenic_period=Seconds between tries
bgn.menu.scenic_period.help=How often the mod tries to put a new scene on the map. A scene that finds no place on this map waits longer each time.
bgn.menu.crowd_density=Crowd density
bgn.menu.crowd_density.help=One setting for your computer's power: how many NPCs and ghosts are on the map. An admin changes the server limits and his own ghosts; other players change only their own ghosts, and only while the server does not run the ghost crowd. When limits are changed by hand, no preset is selected.
bgn.menu.crowd_density.by_server=Controlled by the server: you are not an admin, and the server runs the ghost crowd for every player.
bgn.menu.crowd_density.low=Low
bgn.menu.crowd_density.medium=Medium
bgn.menu.crowd_density.high=High
bgn.menu.crowd_density.ultra=Ultra
bgn.wizard.step=Step %d of %d
bgn.wizard.back=Back
bgn.wizard.next=Next
bgn.wizard.done=Done
bgn.wizard.skip=Skip setup
bgn.wizard.density=How many people on the streets
bgn.wizard.density.desc=Choose how many people walk around the city. More people make the city livelier, but put more load on your computer. If the game lags, pick "Few" or "Some".
bgn.wizard.density.label=How many people in the city
bgn.wizard.density.low=Few
bgn.wizard.density.medium=Some
bgn.wizard.density.high=Many
bgn.wizard.density.ultra=Lots
bgn.wizard.density.l1=Few
bgn.wizard.density.l2=Lots
bgn.wizard.body=What kind of bodies people have
bgn.wizard.body.desc=Regular: the standard game characters. Pick them if you use other mods that change NPCs, or if your computer is weak. NextBot: new characters made by this mod. They walk more smoothly and avoid obstacles, but other NPC mods may not work with them. Not sure? Keep "Regular".
bgn.wizard.body.label=Type of people
bgn.wizard.body.npc=Regular
bgn.wizard.body.nextbot=NextBot (new)
bgn.wizard.body.l1=Regular
bgn.wizard.body.l2=NextBot
bgn.wizard.brain=How people act in a fight
bgn.wizard.brain.desc=Simple: people just run away or fight, which is easier on the game. Smart: people hide behind cover, go around you and pick the best action, but it is heavier for the computer. "Auto" picks for you.
bgn.wizard.brain.label=Behavior in a fight
bgn.wizard.brain.auto=Auto
bgn.wizard.brain.fsm=Simple
bgn.wizard.brain.goap=Smart
bgn.wizard.brain.l1=Simple
bgn.wizard.brain.l2=Smart
bgn.wizard.ghosts=People far away
bgn.wizard.ghosts.desc=Far from you, light "ghost" figures are shown instead of real people. They copy what real people do, and become real when you come close. The city looks full and the game barely slows down. This feature is still experimental.
bgn.wizard.ghosts.c1=Far-away people on the server (for all players)
bgn.wizard.ghosts.c2=Show far-away people to me
bgn.wizard.ghosts.l1=Off
bgn.wizard.ghosts.l2=On
bgn.wizard.scenic=Scenes on the streets
bgn.wizard.scenic.desc=Small scenes appear around the city: a queue for food, a policeman detaining a man, a couple on a couch, someone knocking on a door. If you shoot or hit someone, the people run away.
bgn.wizard.scenic.c1=Show scenes
bgn.wizard.scenic.c2=How many scenes at once
bgn.wizard.scenic.l1=Off
bgn.wizard.scenic.l2=On
bgn.wizard.wanted=Wanted level and police
bgn.wizard.wanted.desc=If you attack a person, witnesses call the police. The longer you break the law, the harder they look for you. With arrest on, the police try to detain you first instead of shooting.
bgn.wizard.wanted.c1=Call the police when you attack
bgn.wizard.wanted.c2=Police try to detain first
bgn.wizard.wanted.c3=How many seconds they look for you
bgn.wizard.voices=Voices and sounds
bgn.wizard.voices.desc=People shout, call the police and talk to each other. Here you can turn off the voices or the street noise. Street noise is heard when many people are around.
bgn.wizard.voices.c1=Voices of people
bgn.wizard.voices.c2=Street noise
bgn.wizard.vehicles=Cars on the roads
bgn.wizard.vehicles.desc=If you install the Decent Vehicle addon, people will drive cars along the roads and give way to each other. Without it there are no cars. To install it, press "Subscribe" below.
bgn.wizard.vehicles.c1=Cars on the roads
bgn.wizard.vehicles.l1=Off
bgn.wizard.vehicles.l2=On
bgn.wizard.vehicles.dv.desc=The addon the cars need to drive.
bgn.wizard.vehicles.pack.desc=Cars for the city: simfphys, cars from GTA San Andreas and Background NPCs support. One button subscribes to all three. You can use other car mods instead.
bgn.wizard.vehicles.required=required
bgn.wizard.vehicles.optional=optional
bgn.wizard.title=Step by step setup
bgn.wizard.vehicles.dv=Decent Vehicle
bgn.wizard.vehicles.pack=Vehicle pack
