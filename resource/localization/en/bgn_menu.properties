bgn.menu.nav_max_nodes=Generated points limit
bgn.menu.nav_max_nodes.help=The most points the generator makes on a map. More points cover the map better but use more memory.
bgn.menu.lod_near_radius=Full update radius
bgn.menu.lod_near_radius.help=Actors closer than this to a player, or seen by one, get full updates; the rest update less often.
bgn.menu.draw_npc_path=Draw actor paths
bgn.menu.draw_npc_path.help=Shows the routes actors walk (for debugging).

